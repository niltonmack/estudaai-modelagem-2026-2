<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EstudaAI — Layout SPEC-003 (aprovado)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              ink: "#123047",
              trail: "#1A7A72",
              trailDark: "#14635D",
              mint: "#D7F0ED",
              spark: "#E3A008",
              paper: "#F7F4EE"
            }
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    .phone-frame {
      width: min(390px, 100%);
      min-height: 640px;
      max-height: 844px;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .is-phone h2, .is-phone p, .is-phone [role="alert"], .is-phone button, .is-phone td, .is-phone th,
    .is-phone label, .is-phone textarea, .is-phone select {
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
    }
    .is-phone .app-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
    }
    .is-phone .app-brand { min-width: 0; flex: 1 1 auto; }
    .is-phone .app-papel,
    .is-phone .app-nav-desktop { display: none !important; }
    .is-phone .app-nav-mobile { display: flex !important; }
    .is-phone .app-session {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      max-width: 58%;
    }
    .is-phone .app-user {
      display: inline !important;
      min-width: 0;
      max-width: 6.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .is-phone .app-sair {
      flex-shrink: 0;
      white-space: nowrap;
    }
    .is-phone table { display: block; }
    .is-phone thead { display: none; }
    .is-phone tbody, .is-phone tr, .is-phone td {
      display: block;
      width: 100%;
    }
    .is-phone tr {
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      margin-bottom: 0.75rem;
      padding: 0.75rem;
      background: #fff;
    }
    .is-phone td { padding: 0.15rem 0; }
    .is-phone .etapa-acoes { flex-wrap: wrap; }
  </style>
</head>
<body class="bg-brand-paper text-brand-ink">
  <header class="border-b border-amber-300 bg-amber-50 px-4 py-3 text-sm">
    <div class="mx-auto flex max-w-6xl flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <p class="font-medium text-amber-950">
        Protótipo SPEC-003 — layout <strong>aprovado</strong> em 2026-10-01. Reutiliza a casca admin da SPEC-001. Não é o app em produção.
        <a class="ml-2 underline" href="identidade.html">Identidade</a>
        · <a class="underline" href="spec-002.html#lista">Categorias SPEC-002</a>
      </p>
      <div class="flex flex-wrap items-center gap-2">
        <label class="text-amber-950">Tela
          <select id="tela" class="ml-1 rounded-md border border-amber-400 bg-white px-2 py-1">
            <option value="lista">Lista de trilhas</option>
            <option value="criar">Nova trilha</option>
            <option value="editar">Editar trilha e etapas</option>
            <option value="ordem">Reordenar etapas</option>
            <option value="recusa-incompleta">Recusa — trilha incompleta</option>
            <option value="recusa-ultima">Recusa — última etapa</option>
          </select>
        </label>
        <label class="text-amber-950">Viewport
          <select id="vp" class="ml-1 rounded-md border border-amber-400 bg-white px-2 py-1">
            <option value="desktop">Desktop</option>
            <option value="phone">Smartphone (390px)</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl p-4 md:p-8">
    <div id="stage" class="mx-auto overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"></div>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const tela = document.getElementById("tela");
    const vp = document.getElementById("vp");

    const hashToTela = {
      lista: "lista",
      criar: "criar",
      formulario: "criar",
      editar: "editar",
      ordem: "ordem",
      recusa: "recusa-incompleta",
      "recusa-incompleta": "recusa-incompleta",
      "recusa-ultima": "recusa-ultima"
    };

    function applyHash() {
      const key = (location.hash || "#lista").slice(1);
      if (hashToTela[key]) tela.value = hashToTela[key];
    }

    function navAdmin() {
      return `
        <span class="rounded-md px-3 py-1.5 text-sm text-slate-500">Painel</span>
        <span class="rounded-md px-3 py-1.5 text-sm text-slate-500">Categorias</span>
        <span class="rounded-md bg-brand-mint px-3 py-1.5 text-sm font-medium text-brand-ink">Trilhas</span>`;
    }

    function casca(inner) {
      return `<div class="min-h-[640px] bg-slate-50">
        <header class="border-b border-slate-200 bg-white">
          <div class="app-bar mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3">
            <div class="app-brand flex min-w-0 items-center gap-3">
              <img src="../identidade/marca.svg" alt="" class="h-8 w-8 shrink-0" />
              <span class="text-sm font-semibold text-brand-ink">EstudaAI</span>
              <span class="app-papel hidden rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-600 sm:inline">Administrador</span>
            </div>
            <nav class="app-nav-desktop hidden items-center gap-1 sm:flex">${navAdmin()}</nav>
            <div class="app-session flex min-w-0 items-center gap-2">
              <span class="app-user hidden max-w-[9rem] truncate text-sm text-slate-600 sm:inline">Mariana Costa</span>
              <button type="button" class="app-sair shrink-0 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-800 hover:bg-slate-50">Sair</button>
            </div>
          </div>
          <nav class="app-nav-mobile flex gap-1 overflow-x-auto border-t border-slate-100 px-4 py-2 sm:hidden">${navAdmin()}</nav>
        </header>
        <section class="mx-auto max-w-5xl px-4 py-8">${inner}</section>
      </div>`;
    }

    function alerta(texto, tom = "red") {
      const cls = tom === "red"
        ? "border-red-200 bg-red-50 text-red-800"
        : tom === "amber"
          ? "border-amber-200 bg-amber-50 text-amber-950"
          : "border-emerald-200 bg-emerald-50 text-emerald-800";
      return `<div class="rounded-md border px-3 py-2 text-sm leading-relaxed ${cls}" role="alert">${texto}</div>`;
    }

    function campo(label, name, value, extra = "") {
      return `<label class="block text-sm font-medium leading-snug text-slate-700">${label}
        <input type="text" name="${name}" value="${value}" ${extra}
          class="mt-1 w-full min-w-0 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none ring-brand-trail focus:border-brand-trail focus:ring-2" />
      </label>`;
    }

    function area(label, name, value, extra = "") {
      return `<label class="block text-sm font-medium leading-snug text-slate-700">${label}
        <textarea name="${name}" rows="3" ${extra}
          class="mt-1 w-full min-w-0 rounded-md border border-slate-300 bg-white px-3 py-2 font-mono text-sm shadow-sm outline-none ring-brand-trail focus:border-brand-trail focus:ring-2">${value}</textarea>
      </label>`;
    }

    function selectCategoria(valor) {
      return `<label class="block text-sm font-medium leading-snug text-slate-700">Categoria
        <select name="categoria" class="mt-1 w-full min-w-0 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none ring-brand-trail focus:border-brand-trail focus:ring-2">
          <option value="" ${valor ? "" : "selected"}>Selecione</option>
          <option ${valor === "Programação" ? "selected" : ""}>Programação</option>
          <option ${valor === "Matemática" ? "selected" : ""}>Matemática</option>
        </select>
      </label>
      <p class="text-xs leading-relaxed text-slate-500">A sentinela <strong>Personalizada</strong> não aparece: ela é reservada às trilhas do agente (SPEC-006). O aluno e o LLM não a escolhem.</p>`;
    }

    function badge(situacao) {
      return situacao === "Publicada"
        ? `<span class="rounded-full bg-brand-mint px-2 py-0.5 text-xs font-medium text-brand-trail">Publicada</span>`
        : `<span class="rounded-full bg-amber-50 px-2 py-0.5 text-xs font-medium text-amber-800">Incompleta</span>`;
    }

    function listaInner(alertaHtml = "") {
      return `
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h2 class="text-2xl font-semibold">Trilhas pré-definidas</h2>
          <p class="mt-1 max-w-xl text-sm leading-relaxed text-slate-600">Percursos curados por Mariana. O tipo é sempre <strong>pré-definida</strong>. Trilhas do agente ficam fora desta tela (RB10 / SPEC-006).</p>
        </div>
        <a href="#criar" class="inline-flex shrink-0 items-center justify-center rounded-md bg-brand-trail px-3 py-2 text-sm font-medium text-white hover:bg-brand-trailDark">Nova trilha</a>
      </div>
      ${alertaHtml ? `<div class="mt-4">${alertaHtml}</div>` : ""}
      <div class="mt-6 overflow-hidden rounded-lg border border-slate-200 bg-white">
        <table class="w-full min-w-0 text-left text-sm">
          <thead class="border-b border-slate-200 bg-slate-50 text-slate-600">
            <tr>
              <th class="px-4 py-2 font-medium">Título</th>
              <th class="px-4 py-2 font-medium">Categoria</th>
              <th class="px-4 py-2 font-medium">Etapas</th>
              <th class="px-4 py-2 font-medium">Situação</th>
              <th class="px-4 py-2 font-medium">Ações</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            <tr>
              <td class="px-4 py-3 font-medium text-brand-ink">Lógica de programação</td>
              <td class="px-4 py-3 text-slate-600">Programação</td>
              <td class="px-4 py-3 text-slate-600">3</td>
              <td class="px-4 py-3">${badge("Publicada")}</td>
              <td class="px-4 py-3">
                <a class="text-brand-trail underline" href="#editar">Editar</a>
                <a class="ml-3 text-brand-trail underline" href="#ordem">Reordenar</a>
                <button type="button" class="ml-3 text-red-700 underline">Remover</button>
              </td>
            </tr>
            <tr>
              <td class="px-4 py-3 font-medium text-brand-ink">Funções e gráficos</td>
              <td class="px-4 py-3 text-slate-600">Matemática</td>
              <td class="px-4 py-3 text-slate-600">0</td>
              <td class="px-4 py-3">${badge("Incompleta")}</td>
              <td class="px-4 py-3">
                <a class="text-brand-trail underline" href="#criar">Editar</a>
                <a class="ml-3 text-brand-trail underline" href="#recusa-incompleta">Disponibilizar</a>
                <button type="button" class="ml-3 text-red-700 underline">Remover</button>
              </td>
            </tr>
            <tr>
              <td class="px-4 py-3 font-medium text-brand-ink">Condicionais</td>
              <td class="px-4 py-3 text-slate-600">Programação</td>
              <td class="px-4 py-3 text-slate-600">1</td>
              <td class="px-4 py-3">${badge("Publicada")}</td>
              <td class="px-4 py-3">
                <a class="text-brand-trail underline" href="#recusa-ultima">Editar</a>
                <button type="button" class="ml-3 text-red-700 underline">Remover</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="mt-4 text-xs text-slate-500">RB03: só entra no catálogo do aluno com categoria e 1..* etapas ordenadas. Remoção com aluno em andamento é SPEC-005.</p>`;
    }

    function cardEtapa({ ordem, titulo, conteudo, unica, reordenar, primeiro, ultimo }) {
      const acoesReordenar = reordenar ? `
        <div class="etapa-acoes flex shrink-0 gap-1">
          <button type="button" class="rounded-md border border-slate-300 bg-white px-2 py-1 text-xs font-medium text-slate-700 ${primeiro ? "opacity-40" : ""}" ${primeiro ? "disabled" : ""}>↑</button>
          <button type="button" class="rounded-md border border-slate-300 bg-white px-2 py-1 text-xs font-medium text-slate-700 ${ultimo ? "opacity-40" : ""}" ${ultimo ? "disabled" : ""}>↓</button>
        </div>` : "";
      const remover = unica
        ? `<a class="text-red-700 underline" href="#recusa-ultima">Remover</a>`
        : `<button type="button" class="text-red-700 underline">Remover</button>`;
      return `<article class="rounded-lg border border-slate-200 bg-white p-4">
        <div class="flex items-start justify-between gap-3">
          <p class="text-xs font-medium uppercase tracking-wide text-brand-trail">Etapa <span class="tabular-nums">${ordem}</span></p>
          ${acoesReordenar}
        </div>
        <div class="mt-3 space-y-3">
          ${campo("Título da etapa", "etapa-titulo-" + ordem, titulo)}
          ${area("Conteúdo (Markdown)", "etapa-conteudo-" + ordem, conteudo)}
        </div>
        <p class="mt-2 flex flex-wrap items-center gap-3 text-xs text-slate-500">
          <span>ordem = ${ordem}</span>
          ${reordenar ? "" : remover}
        </p>
      </article>`;
    }

    function formulario({ modo, alertaHtml = "" }) {
      const criar = modo === "criar";
      const unica = modo === "ultima";
      const reordenar = modo === "ordem";
      const tituloPagina = criar
        ? "Nova trilha pré-definida"
        : reordenar
          ? "Reordenar etapas"
          : "Editar trilha e etapas";
      const intro = criar
        ? "Cadastro exclusivo do administrador. Título, descrição, uma categoria (não sentinela) e etapas com ordem explícita. O conteúdo da etapa é Markdown, não uma URL."
        : reordenar
          ? "A6: a sequência muda; cada etapa conserva a própria identidade. Conclusões já registradas permanecem ligadas à etapa, não à posição."
          : "Altera título, descrição, categoria e o Markdown das etapas. Publicar só vale se RB03 for verdadeiro.";
      const etapas = criar
        ? `<p class="rounded-lg border border-dashed border-slate-300 bg-slate-50 px-4 py-6 text-sm text-slate-500">Nenhuma etapa ainda. Uma trilha sem etapas <strong>não</strong> entra no catálogo (RB03).</p>
           <button type="button" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Adicionar etapa</button>`
        : unica
          ? cardEtapa({
              ordem: 1,
              titulo: "Se e senão",
              conteudo: "## Condicionais\n\nCompare valores e desvie o fluxo.\n\n- `if`\n- `else`",
              unica: true
            })
          : [
              cardEtapa({
                ordem: 1,
                titulo: "Variáveis e tipos",
                conteudo: "## Variáveis\n\nNomes e tipos primitivos.\n\n- `let`\n- `const`",
                reordenar,
                primeiro: true
              }),
              cardEtapa({
                ordem: 2,
                titulo: "Condicionais",
                conteudo: "## Se e senão\n\nDesvio de fluxo com comparação.",
                reordenar
              }),
              cardEtapa({
                ordem: 3,
                titulo: "Laços",
                conteudo: "## Repetição\n\n`for` e `while` com um exemplo curto.",
                reordenar,
                ultimo: true
              })
            ].join("");

      const acoes = reordenar
        ? `<button type="button" class="w-full rounded-md bg-brand-trail px-3 py-2 text-sm font-medium text-white hover:bg-brand-trailDark sm:w-auto">Salvar sequência</button>`
        : `<button type="button" class="w-full rounded-md bg-brand-trail px-3 py-2 text-sm font-medium text-white hover:bg-brand-trailDark sm:w-auto">${criar ? "Publicar no catálogo" : "Salvar e publicar"}</button>`;

      return `
        <p class="text-sm text-slate-500"><a class="text-brand-trail underline" href="#lista">← Trilhas pré-definidas</a></p>
        <h2 class="mt-2 text-2xl font-semibold leading-snug">${tituloPagina}</h2>
        <p class="mt-1 text-sm leading-relaxed text-slate-600">${intro}</p>
        ${alertaHtml ? `<div class="mt-4">${alertaHtml}</div>` : ""}
        <form class="mt-6 max-w-2xl space-y-4">
          ${campo("Título", "titulo", criar ? "" : unica ? "Condicionais" : "Lógica de programação", criar ? 'placeholder="Ex.: Introdução à lógica"' : "")}
          ${area("Descrição", "descricao", criar ? "" : unica ? "Primeiro desvio de fluxo em código." : "Percurso curado de fundamentos de código.")}
          ${selectCategoria(criar ? "" : "Programação")}
          <p class="rounded-md bg-slate-50 px-3 py-2 text-xs text-slate-600">Tipo: <strong>pré-definida</strong> (não editável nesta Spec). Não há geração por LLM aqui.</p>
          <div class="border-t border-slate-200 pt-4">
            <div class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
              <div>
                <h3 class="text-lg font-semibold">Etapas</h3>
                <p class="text-sm text-slate-600">Associação e sequência visíveis (RF12). A ordem é um número explícito, não a posição visual sozinha.</p>
              </div>
              ${criar || reordenar ? "" : `<button type="button" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Adicionar etapa</button>`}
            </div>
            <div class="mt-4 space-y-3">${etapas}</div>
          </div>
          <div class="flex flex-col gap-2 pt-2 sm:flex-row">
            ${acoes}
            <a href="#lista" class="inline-block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-center text-sm font-medium text-slate-700 hover:bg-slate-50 sm:w-auto">Cancelar</a>
          </div>
        </form>
      `;
    }

    function render() {
      stage.className = vp.value === "phone"
        ? "is-phone phone-frame mx-auto rounded-[1.5rem] border-8 border-slate-900 bg-white shadow-lg"
        : "overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm";

      const v = tela.value;
      let inner = "";
      if (v === "lista") inner = listaInner();
      if (v === "criar") inner = formulario({ modo: "criar" });
      if (v === "editar") inner = formulario({ modo: "editar" });
      if (v === "ordem") inner = formulario({ modo: "ordem" });
      if (v === "recusa-incompleta") {
        inner = listaInner(alerta("Não é possível disponibilizar «Funções e gráficos»: a trilha precisa de categoria e ao menos uma etapa ordenada (RB03). Nada foi publicado."));
      }
      if (v === "recusa-ultima") {
        inner = formulario({
          modo: "ultima",
          alertaHtml: alerta("Não é possível remover a última etapa de «Condicionais». A trilha ficaria sem etapas (RB03). Nada foi apagado.")
        });
      }

      const wrap = document.createElement("div");
      wrap.innerHTML = casca(inner);
      stage.replaceChildren(wrap);
      stage.querySelectorAll("a[href^='#']").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const id = a.getAttribute("href").slice(1);
          if (hashToTela[id]) {
            tela.value = hashToTela[id];
            history.replaceState(null, "", "#" + tela.value);
            render();
          }
        });
      });
    }

    tela.addEventListener("change", () => {
      history.replaceState(null, "", "#" + tela.value);
      render();
    });
    vp.addEventListener("change", render);
    window.addEventListener("hashchange", () => { applyHash(); render(); });
    applyHash();
    render();
  </script>
</body>
</html>
