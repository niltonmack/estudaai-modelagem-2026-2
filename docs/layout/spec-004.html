<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EstudaAI — Layout SPEC-004 (aprovado)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              ink: "#123047",
              trail: "#1A7A72",
              trailDark: "#14635D",
              mint: "#D7F0ED",
              spark: "#E3A008",
              paper: "#F7F4EE"
            }
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    .phone-frame {
      width: min(390px, 100%);
      min-height: 640px;
      max-height: 844px;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .is-phone h2, .is-phone p, .is-phone [role="alert"], .is-phone button, .is-phone li {
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
    }
    .is-phone .app-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
    }
    .is-phone .app-brand { min-width: 0; flex: 1 1 auto; }
    .is-phone .app-papel,
    .is-phone .app-nav-desktop { display: none !important; }
    .is-phone .app-nav-mobile { display: flex !important; }
    .is-phone .app-session {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      max-width: 58%;
    }
    .is-phone .app-user {
      display: inline !important;
      min-width: 0;
      max-width: 6.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .is-phone .app-sair { flex-shrink: 0; white-space: nowrap; }
  </style>
</head>
<body class="bg-brand-paper text-brand-ink">
  <header class="border-b border-amber-300 bg-amber-50 px-4 py-3 text-sm">
    <div class="mx-auto flex max-w-6xl flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <p class="font-medium text-amber-950">
        Protótipo SPEC-004 — layout <strong>aprovado</strong> em 2026-10-01. Casca do aluno da SPEC-001. Não é o app em produção.
        <a class="ml-2 underline" href="identidade.html">Identidade</a>
        · <a class="underline" href="spec-003.html#lista">Trilhas SPEC-003</a>
      </p>
      <div class="flex flex-wrap items-center gap-2">
        <label class="text-amber-950">Tela
          <select id="tela" class="ml-1 rounded-md border border-amber-400 bg-white px-2 py-1">
            <option value="catalogo-anonimo">Catálogo — anônimo</option>
            <option value="catalogo">Catálogo — aluno</option>
            <option value="trilha">Detalhe da trilha</option>
            <option value="progresso">Progresso e histórico</option>
            <option value="conclusao">Marcar etapa concluída</option>
            <option value="indisponivel">Catálogo indisponível (E4)</option>
            <option value="recusa">Recusa — anônimo escolhe</option>
          </select>
        </label>
        <label class="text-amber-950">Viewport
          <select id="vp" class="ml-1 rounded-md border border-amber-400 bg-white px-2 py-1">
            <option value="desktop">Desktop</option>
            <option value="phone">Smartphone (390px)</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl p-4 md:p-8">
    <div id="stage" class="mx-auto overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"></div>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const tela = document.getElementById("tela");
    const vp = document.getElementById("vp");

    const hashToTela = {
      catalogo: "catalogo",
      "catalogo-anonimo": "catalogo-anonimo",
      trilha: "trilha",
      progresso: "progresso",
      conclusao: "conclusao",
      indisponivel: "indisponivel",
      recusa: "recusa"
    };

    function applyHash() {
      const key = (location.hash || "#catalogo-anonimo").slice(1);
      if (hashToTela[key]) tela.value = hashToTela[key];
    }

    function navAluno(ativo) {
      const item = (id, label) => {
        const on = ativo === id;
        return `<span class="${on ? "rounded-md bg-brand-mint px-3 py-1.5 text-sm font-medium text-brand-ink" : "rounded-md px-3 py-1.5 text-sm text-slate-500"}">${label}</span>`;
      };
      return `${item("inicio", "Início")}${item("catalogo", "Catálogo")}${item("progresso", "Meu progresso")}`;
    }

    function cascaAluno(ativo, inner) {
      return `<div class="min-h-[640px] bg-slate-50">
        <header class="border-b border-slate-200 bg-white">
          <div class="app-bar mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3">
            <div class="app-brand flex min-w-0 items-center gap-3">
              <img src="../identidade/marca.svg" alt="" class="h-8 w-8 shrink-0" />
              <span class="text-sm font-semibold text-brand-ink">EstudaAI</span>
              <span class="app-papel hidden rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-600 sm:inline">Aluno</span>
            </div>
            <nav class="app-nav-desktop hidden items-center gap-1 sm:flex">${navAluno(ativo)}</nav>
            <div class="app-session flex min-w-0 items-center gap-2">
              <span class="app-user hidden max-w-[9rem] truncate text-sm text-slate-600 sm:inline">Lucas Almeida</span>
              <button type="button" class="app-sair shrink-0 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-800 hover:bg-slate-50">Sair</button>
            </div>
          </div>
          <nav class="app-nav-mobile flex gap-1 overflow-x-auto border-t border-slate-100 px-4 py-2 sm:hidden">${navAluno(ativo)}</nav>
        </header>
        <section class="mx-auto max-w-5xl px-4 py-8">${inner}</section>
      </div>`;
    }

    function cascaAnonima(inner) {
      const nav = `
        <span class="rounded-md bg-brand-mint px-3 py-1.5 text-sm font-medium text-brand-ink">Catálogo</span>
        <span class="rounded-md px-3 py-1.5 text-sm text-slate-400" title="SPEC-006">Trilha personalizada</span>`;
      return `<div class="min-h-[640px] bg-slate-50">
        <header class="border-b border-slate-200 bg-white">
          <div class="app-bar mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3">
            <div class="app-brand flex min-w-0 items-center gap-3">
              <img src="../identidade/marca.svg" alt="" class="h-8 w-8 shrink-0" />
              <span class="text-sm font-semibold text-brand-ink">EstudaAI</span>
            </div>
            <nav class="app-nav-desktop hidden items-center gap-1 sm:flex">${nav}</nav>
            <div class="app-session flex min-w-0 items-center gap-2">
              <a href="#recusa" class="app-sair shrink-0 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-800 hover:bg-slate-50">Entrar</a>
            </div>
          </div>
          <nav class="app-nav-mobile flex gap-1 overflow-x-auto border-t border-slate-100 px-4 py-2 sm:hidden">${nav}</nav>
        </header>
        <section class="mx-auto max-w-5xl px-4 py-8">${inner}</section>
      </div>`;
    }

    function alerta(texto, tom = "red") {
      const cls = tom === "red"
        ? "border-red-200 bg-red-50 text-red-800"
        : tom === "amber"
          ? "border-amber-200 bg-amber-50 text-amber-950"
          : "border-emerald-200 bg-emerald-50 text-emerald-800";
      return `<div class="rounded-md border px-3 py-2 text-sm leading-relaxed ${cls}" role="alert">${texto}</div>`;
    }

    function barra(feitos, total) {
      const pct = total ? Math.round((feitos / total) * 100) : 0;
      return `<div>
        <p class="text-sm font-medium text-brand-ink">Progresso: ${feitos} de ${total} etapas <span class="font-normal text-slate-500">(${pct}%)</span></p>
        <p class="text-xs text-slate-500">Valor derivado. Não há campo para editar o percentual (RB06).</p>
        <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-200" aria-hidden="true">
          <div class="h-full rounded-full bg-brand-trail" style="width:${pct}%"></div>
        </div>
      </div>`;
    }

    function cardTrilha({ titulo, desc, categoria, etapas, acao, href }) {
      return `<article class="rounded-lg border border-slate-200 bg-white p-4">
        <p class="text-xs font-medium uppercase tracking-wide text-brand-trail">${categoria}</p>
        <h3 class="mt-1 text-lg font-semibold text-brand-ink">${titulo}</h3>
        <p class="mt-1 text-sm leading-relaxed text-slate-600">${desc}</p>
        <p class="mt-2 text-xs text-slate-500">${etapas} etapas ordenadas · pré-definida</p>
        <a href="${href}" class="mt-3 inline-flex rounded-md bg-brand-trail px-3 py-2 text-sm font-medium text-white hover:bg-brand-trailDark">${acao}</a>
      </article>`;
    }

    function catalogoCards(anonimo) {
      const href1 = anonimo ? "#recusa" : "#trilha";
      const href2 = anonimo ? "#recusa" : "#trilha";
      const acao1 = anonimo ? "Escolher trilha" : "Continuar";
      const acao2 = anonimo ? "Escolher trilha" : "Começar";
      return `
        <section class="mt-6">
          <h3 class="text-sm font-semibold uppercase tracking-wide text-slate-500">Programação</h3>
          <div class="mt-3 grid gap-4 sm:grid-cols-2">
            ${cardTrilha({ titulo: "Lógica de programação", desc: "Percurso curado de fundamentos de código.", categoria: "Programação", etapas: 3, acao: acao1, href: href1 })}
            ${cardTrilha({ titulo: "Condicionais", desc: "Primeiro desvio de fluxo em código.", categoria: "Programação", etapas: 1, acao: acao2, href: href2 })}
          </div>
        </section>
        <section class="mt-8">
          <h3 class="text-sm font-semibold uppercase tracking-wide text-slate-500">Matemática</h3>
          <div class="mt-3 grid gap-4 sm:grid-cols-2">
            ${cardTrilha({ titulo: "Funções e gráficos", desc: "Relações e representação visual.", categoria: "Matemática", etapas: 2, acao: acao2, href: href2 })}
          </div>
        </section>
        <p class="mt-6 text-xs text-slate-500">Só trilhas pré-definidas <strong>publicadas</strong> (RB03). A sentinela Personalizada não aparece como escolha (SPEC-006). O administrador não usa esta tela (RB14).</p>`;
    }

    function catalogoInner(anonimo, alertaHtml = "") {
      const intro = anonimo
        ? "Você pode ver o catálogo sem conta. Escolher uma trilha e marcar progresso exigem login de aluno (RB01)."
        : "Trilhas curadas por categoria. Se você já acompanha uma, o botão retoma o mesmo progresso — não cria outro (A6).";
      return `
        <h2 class="text-2xl font-semibold">Catálogo</h2>
        <p class="mt-1 max-w-xl text-sm leading-relaxed text-slate-600">${intro}</p>
        ${alertaHtml ? `<div class="mt-4">${alertaHtml}</div>` : ""}
        ${catalogoCards(anonimo)}`;
    }

    function etapaCard({ ordem, titulo, html, estado, data }) {
      const selo = estado === "feita"
        ? `<span class="rounded-full bg-brand-mint px-2 py-0.5 text-xs font-medium text-brand-trail">Concluída${data ? " em " + data : ""}</span>`
        : estado === "atual"
          ? `<span class="rounded-full bg-amber-50 px-2 py-0.5 text-xs font-medium text-amber-800">Próxima</span>`
          : `<span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-600">A seguir</span>`;
      const acao = estado === "atual"
        ? `<a href="#conclusao" class="mt-3 inline-flex rounded-md bg-brand-trail px-3 py-2 text-sm font-medium text-white hover:bg-brand-trailDark">Marcar como concluída</a>`
        : estado === "feita"
          ? `<p class="mt-3 text-xs text-slate-500">Já marcada. Remarcar não cria segunda conclusão (idempotente).</p>`
          : "";
      return `<article class="rounded-lg border border-slate-200 bg-white p-4 ${estado === "atual" ? "ring-2 ring-brand-trail" : ""}">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <p class="text-xs font-medium uppercase tracking-wide text-brand-trail">Etapa ${ordem}</p>
          ${selo}
        </div>
        <h3 class="mt-2 text-base font-semibold">${titulo}</h3>
        <div class="prose-proto mt-2 space-y-2 text-sm leading-relaxed text-slate-700">${html}</div>
        ${acao}
      </article>`;
    }

    function mdVar() {
      return `<h4 class="font-semibold">Variáveis</h4><p>Nomes e tipos primitivos.</p><ul class="list-disc pl-5"><li><code>let</code></li><li><code>const</code></li></ul>`;
    }
    function mdIf() {
      return `<h4 class="font-semibold">Se e senão</h4><p>Desvio de fluxo com comparação.</p>`;
    }
    function mdLoop() {
      return `<h4 class="font-semibold">Repetição</h4><p><code>for</code> e <code>while</code> com um exemplo curto.</p>`;
    }

    function acompanhamento({ feitos, marcar }) {
      const etapas = [
        etapaCard({ ordem: 1, titulo: "Variáveis e tipos", html: mdVar(), estado: feitos >= 1 ? "feita" : "atual", data: feitos >= 1 ? "01/10/2026" : null }),
        etapaCard({ ordem: 2, titulo: "Condicionais", html: mdIf(), estado: feitos >= 2 ? "feita" : feitos === 1 ? "atual" : "depois", data: feitos >= 2 ? "01/10/2026" : null }),
        etapaCard({ ordem: 3, titulo: "Laços", html: mdLoop(), estado: feitos >= 3 ? "feita" : feitos === 2 ? "atual" : "depois" })
      ].join("");
      const historico = feitos === 0
        ? `<p class="text-sm text-slate-500">Nenhuma conclusão ainda. Etapas sem marcação <strong>não</strong> entram no percentual (RB05).</p>`
        : `<ul class="mt-2 space-y-2 text-sm text-slate-700">
            <li>01/10/2026 — Variáveis e tipos</li>
            ${feitos >= 2 ? "<li>01/10/2026 — Condicionais</li>" : ""}
          </ul>`;
      const alertaHtml = marcar
        ? alerta("Etapa «Variáveis e tipos» registrada. O percentual passou a 1 de 3. A próxima etapa está destacada.", "green")
        : "";
      return `
        <p class="text-sm text-slate-500"><a class="text-brand-trail underline" href="#catalogo">← Catálogo</a></p>
        <h2 class="mt-2 text-2xl font-semibold leading-snug">Lógica de programação</h2>
        <p class="mt-1 text-sm text-slate-500">Programação · trilha pré-definida</p>
        <p class="mt-2 max-w-xl text-sm leading-relaxed text-slate-600">Percurso curado de fundamentos de código. Conteúdo em Markdown, não em URL.</p>
        ${alertaHtml ? `<div class="mt-4">${alertaHtml}</div>` : ""}
        <div class="mt-6 rounded-lg border border-slate-200 bg-white p-4">${barra(feitos, 3)}</div>
        <div class="mt-6 space-y-3">${etapas}</div>
        <section class="mt-8">
          <h3 class="text-lg font-semibold">Histórico</h3>
          <p class="text-sm text-slate-600">Conclusões deste progresso, enquanto ele estiver ativo. Não há pausar, abandonar nem reiniciar (OPEN-15).</p>
          ${historico}
        </section>
        <p class="mt-6 text-xs text-slate-500">Escolher de novo esta trilha retoma o mesmo acompanhamento. Conversa com o agente entra na SPEC-007.</p>`;
    }

    function progressoLista() {
      return `
        <h2 class="text-2xl font-semibold">Meu progresso</h2>
        <p class="mt-1 max-w-xl text-sm leading-relaxed text-slate-600">Acompanhamento individual. O administrador não tem esta tela. O percentual não se edita: só cresce com marcação explícita.</p>
        <div class="mt-6 space-y-4">
          <article class="rounded-lg border border-slate-200 bg-white p-4">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <h3 class="font-semibold text-brand-ink">Lógica de programação</h3>
                <p class="text-sm text-slate-600">Programação · iniciado em 01/10/2026</p>
              </div>
              <a href="#conclusao" class="inline-flex shrink-0 rounded-md bg-brand-trail px-3 py-2 text-sm font-medium text-white hover:bg-brand-trailDark">Abrir trilha</a>
            </div>
            <div class="mt-4">${barra(1, 3)}</div>
            <p class="mt-3 text-xs text-slate-500">Histórico: Variáveis e tipos (01/10/2026). Próxima: Condicionais.</p>
          </article>
        </div>
        <p class="mt-4 text-xs text-slate-500">A4: consultar sem marcar nova etapa. A6: retomar não duplica o progresso.</p>`;
    }

    function indisponivel() {
      return `
        <h2 class="text-2xl font-semibold">Catálogo</h2>
        <div class="mt-4">${alerta("O catálogo está indisponível: não há trilhas pré-definidas publicadas e o agente de apoio está desligado. Nenhuma trilha nova foi criada (E4 / OPEN-22).", "amber")}</div>
        <p class="mt-4 max-w-xl text-sm leading-relaxed text-slate-600">Quando Mariana publicar um percurso (SPEC-003) ou ligar o agente (SPEC-006), esta tela deixa de aparecer vazia. Pedir trilha personalizada agora não está disponível.</p>`;
    }

    function render() {
      stage.className = vp.value === "phone"
        ? "is-phone phone-frame mx-auto rounded-[1.5rem] border-8 border-slate-900 bg-white shadow-lg"
        : "overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm";

      const v = tela.value;
      let html = "";
      if (v === "catalogo-anonimo") html = cascaAnonima(catalogoInner(true));
      if (v === "catalogo") html = cascaAluno("catalogo", catalogoInner(false));
      if (v === "trilha") html = cascaAluno("catalogo", acompanhamento({ feitos: 0, marcar: false }));
      if (v === "progresso") html = cascaAluno("progresso", progressoLista());
      if (v === "conclusao") html = cascaAluno("catalogo", acompanhamento({ feitos: 1, marcar: true }));
      if (v === "indisponivel") html = cascaAluno("catalogo", indisponivel());
      if (v === "recusa") {
        html = cascaAnonima(catalogoInner(true, alerta("Para escolher uma trilha e registrar progresso, entre como aluno. A listagem do catálogo continua visível (E1 / RB01).") + `<p class="mt-3 text-sm"><a class="text-brand-trail underline" href="spec-001.html#login">Ir para o login</a></p>`));
      }

      const wrap = document.createElement("div");
      wrap.innerHTML = html;
      stage.replaceChildren(wrap);
      stage.querySelectorAll("a[href^='#']").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const id = a.getAttribute("href").slice(1);
          if (hashToTela[id]) {
            tela.value = hashToTela[id];
            history.replaceState(null, "", "#" + tela.value);
            render();
          }
        });
      });
    }

    tela.addEventListener("change", () => {
      history.replaceState(null, "", "#" + tela.value);
      render();
    });
    vp.addEventListener("change", render);
    window.addEventListener("hashchange", () => { applyHash(); render(); });
    applyHash();
    render();
  </script>
</body>
</html>
