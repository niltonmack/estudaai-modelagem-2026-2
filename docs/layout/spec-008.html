<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EstudaAI — Layout SPEC-008 (aprovado)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              ink: "#123047",
              trail: "#1A7A72",
              trailDark: "#14635D",
              mint: "#D7F0ED",
              spark: "#E3A008",
              paper: "#F7F4EE"
            }
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    .phone-frame {
      width: min(390px, 100%);
      min-height: 640px;
      max-height: 844px;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .is-phone h2, .is-phone p, .is-phone [role="alert"], .is-phone button, .is-phone td, .is-phone th {
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
    }
    .is-phone .app-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
    }
    .is-phone .app-brand { min-width: 0; flex: 1 1 auto; }
    .is-phone .app-papel,
    .is-phone .app-nav-desktop { display: none !important; }
    .is-phone .app-nav-mobile { display: flex !important; }
    .is-phone .app-session {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      max-width: 58%;
    }
    .is-phone .app-user {
      display: inline !important;
      min-width: 0;
      max-width: 6.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .is-phone .app-sair { flex-shrink: 0; white-space: nowrap; }
    .is-phone table { display: block; }
    .is-phone thead { display: none; }
    .is-phone tbody, .is-phone tr, .is-phone td { display: block; width: 100%; }
    .is-phone tr {
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      margin-bottom: 0.75rem;
      padding: 0.75rem;
      background: #fff;
    }
    .is-phone td { padding: 0.15rem 0; }
  </style>
</head>
<body class="bg-brand-paper text-brand-ink">
  <header class="border-b border-amber-300 bg-amber-50 px-4 py-3 text-sm">
    <div class="mx-auto flex max-w-6xl flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <p class="font-medium text-amber-950">
        Protótipo SPEC-008 — layout <strong>aprovado</strong> em 2026-10-08. Reutiliza a casca admin da SPEC-001. Não é o app em produção.
        <a class="ml-2 underline" href="identidade.html">Identidade</a>
      </p>
      <div class="flex flex-wrap items-center gap-2">
        <label class="text-amber-950">Tela
          <select id="tela" class="ml-1 rounded-md border border-amber-400 bg-white px-2 py-1">
            <option value="lista">Lista de usuários</option>
            <option value="criar">Nova conta</option>
            <option value="editar">Editar conta</option>
            <option value="recusa-ultimo">Recusa — último administrador</option>
            <option value="recusa-progresso">Recusa — aluno com progresso</option>
          </select>
        </label>
        <label class="text-amber-950">Viewport
          <select id="vp" class="ml-1 rounded-md border border-amber-400 bg-white px-2 py-1">
            <option value="desktop">Desktop</option>
            <option value="phone">Smartphone (390px)</option>
          </select>
        </label>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-6xl p-4 md:p-8">
    <div id="stage" class="mx-auto overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"></div>
  </main>
  <script>
    const stage = document.getElementById("stage");
    const tela = document.getElementById("tela");
    const vp = document.getElementById("vp");
    const hashToTela = {
      lista: "lista", criar: "criar", editar: "editar",
      "recusa-ultimo": "recusa-ultimo", "recusa-progresso": "recusa-progresso"
    };
    function applyHash() {
      const key = (location.hash || "#lista").slice(1);
      if (hashToTela[key]) tela.value = hashToTela[key];
    }
    function navAdmin(ativo) {
      const on = (id) => id === ativo
        ? "rounded-md bg-brand-mint px-3 py-1.5 text-sm font-medium text-brand-ink"
        : "rounded-md px-3 py-1.5 text-sm text-slate-400";
      return `
        <span class="${on("painel")}">Painel</span>
        <span class="${on("categorias")}">Categorias</span>
        <span class="${on("trilhas")}">Trilhas</span>
        <span class="${on("usuarios")}">Usuários</span>
        <span class="${on("andamento")}">Andamento</span>
        <span class="${on("agente")}">Agente LLM</span>`;
    }
    function casca(inner) {
      return `<div class="min-h-[640px] bg-slate-50">
        <header class="border-b border-slate-200 bg-white">
          <div class="app-bar mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3">
            <div class="app-brand flex min-w-0 items-center gap-3">
              <img src="../identidade/marca.svg" alt="" class="h-8 w-8 shrink-0" />
              <span class="text-sm font-semibold text-brand-ink">EstudaAI</span>
              <span class="app-papel hidden rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-600 sm:inline">Administrador</span>
            </div>
            <nav class="app-nav-desktop hidden items-center gap-1 sm:flex">${navAdmin("usuarios")}</nav>
            <div class="app-session flex min-w-0 items-center gap-2">
              <span class="app-user hidden max-w-[9rem] truncate text-sm text-slate-600 sm:inline">Mariana Costa</span>
              <button type="button" class="app-sair shrink-0 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-800 hover:bg-slate-50">Sair</button>
            </div>
          </div>
          <nav class="app-nav-mobile flex gap-1 overflow-x-auto border-t border-slate-100 px-4 py-2 sm:hidden">${navAdmin("usuarios")}</nav>
        </header>
        <section class="mx-auto max-w-5xl px-4 py-8">${inner}</section>
      </div>`;
    }
    function alerta(texto) {
      return `<div class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm leading-relaxed text-red-800" role="alert">${texto}</div>`;
    }
    function campo(label, name, value, extra = "") {
      return `<label class="block text-sm font-medium leading-snug text-slate-700">${label}
        <input type="text" name="${name}" value="${value}" ${extra}
          class="mt-1 w-full min-w-0 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none ring-brand-trail focus:border-brand-trail focus:ring-2" />
      </label>`;
    }
    const listaInner = (alertaHtml = "") => `
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h2 class="text-2xl font-semibold">Usuários</h2>
          <p class="mt-1 max-w-xl text-sm leading-relaxed text-slate-600">Contas de alunos e de administradores. Só a administradora altera. O cadastro público continua criando somente aluno.</p>
        </div>
        <a href="#criar" class="inline-flex shrink-0 items-center justify-center rounded-md bg-brand-trail px-3 py-2 text-sm font-medium text-white hover:bg-brand-trailDark">Nova conta</a>
      </div>
      ${alertaHtml ? `<div class="mt-4">${alertaHtml}</div>` : ""}
      <div class="mt-6 overflow-hidden rounded-lg border border-slate-200 bg-white">
        <table class="w-full min-w-0 text-left text-sm">
          <thead class="border-b border-slate-200 bg-slate-50 text-slate-600">
            <tr>
              <th class="px-4 py-2 font-medium">Nome</th>
              <th class="px-4 py-2 font-medium">E-mail</th>
              <th class="px-4 py-2 font-medium">Perfil</th>
              <th class="px-4 py-2 font-medium">Ações</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            <tr class="bg-brand-mint/30">
              <td class="px-4 py-3 font-medium text-brand-ink">Mariana Costa</td>
              <td class="px-4 py-3 text-slate-600">mariana@estudaai.local</td>
              <td class="px-4 py-3">Administrador <span class="ml-1 rounded-full bg-white px-2 py-0.5 text-xs text-brand-trail">você</span></td>
              <td class="px-4 py-3">
                <a class="text-brand-trail underline" href="#editar">Editar</a>
                <a class="ml-3 text-red-700 underline" href="#recusa-ultimo">Remover</a>
              </td>
            </tr>
            <tr>
              <td class="px-4 py-3 font-medium text-brand-ink">Lucas Almeida</td>
              <td class="px-4 py-3 text-slate-600">lucas@exemplo.com</td>
              <td class="px-4 py-3 text-slate-600">Aluno</td>
              <td class="px-4 py-3">
                <a class="text-brand-trail underline" href="#editar">Editar</a>
                <a class="ml-3 text-red-700 underline" href="#recusa-progresso">Remover</a>
              </td>
            </tr>
            <tr>
              <td class="px-4 py-3 font-medium text-brand-ink">Ana Souza</td>
              <td class="px-4 py-3 text-slate-600">ana@exemplo.com</td>
              <td class="px-4 py-3 text-slate-600">Aluno</td>
              <td class="px-4 py-3">
                <a class="text-brand-trail underline" href="#editar">Editar</a>
                <button type="button" class="ml-3 text-red-700 underline">Remover</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="mt-4 text-xs text-slate-500">Não é possível remover a própria conta, o último administrador nem um aluno que já acompanha uma trilha.</p>
    `;
    function formulario(modo) {
      const criar = modo === "criar";
      return `
        <p class="text-sm text-slate-500"><a class="text-brand-trail underline" href="#lista">← Usuários</a></p>
        <h2 class="mt-2 text-2xl font-semibold leading-snug">${criar ? "Nova conta" : "Editar conta"}</h2>
        <p class="mt-1 text-sm leading-relaxed text-slate-600">${criar ? "Escolha se a conta é de aluno ou de administrador. A senha é gravada com proteção; ninguém a vê depois." : "Altere nome, e-mail, senha ou perfil. Deixe a senha em branco para mantê-la."}</p>
        <form class="mt-6 max-w-lg space-y-4">
          ${campo("Nome", "nome", criar ? "" : "Lucas Almeida")}
          ${campo("E-mail", "email", criar ? "" : "lucas@exemplo.com")}
          <label class="block text-sm font-medium leading-snug text-slate-700">Senha
            <input type="password" name="senha" ${criar ? "required" : "placeholder=\"Deixe em branco para manter\""}
              class="mt-1 w-full min-w-0 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none ring-brand-trail focus:border-brand-trail focus:ring-2" />
          </label>
          <label class="block text-sm font-medium leading-snug text-slate-700">Perfil
            <select name="perfil" class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm">
              <option value="aluno" ${criar ? "selected" : "selected"}>Aluno</option>
              <option value="administrador">Administrador</option>
            </select>
          </label>
          <button type="button" class="w-full rounded-md bg-brand-trail px-3 py-2 text-sm font-medium text-white hover:bg-brand-trailDark sm:w-auto">${criar ? "Cadastrar" : "Salvar alterações"}</button>
          <a href="#lista" class="ml-0 inline-block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-center text-sm font-medium text-slate-700 hover:bg-slate-50 sm:ml-2 sm:w-auto">Cancelar</a>
        </form>
      `;
    }
    function render() {
      stage.className = vp.value === "phone"
        ? "is-phone phone-frame mx-auto rounded-[1.5rem] border-8 border-slate-900 bg-white shadow-lg"
        : "overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm";
      const v = tela.value;
      let inner = "";
      if (v === "lista") inner = listaInner();
      if (v === "criar") inner = formulario("criar");
      if (v === "editar") inner = formulario("editar");
      if (v === "recusa-ultimo") inner = listaInner(alerta("Não é possível remover «Mariana Costa»: é a última conta de administradora. Nada foi apagado."));
      if (v === "recusa-progresso") inner = listaInner(alerta("Não é possível remover «Lucas Almeida»: há trilhas em acompanhamento. Nada foi apagado."));
      const wrap = document.createElement("div");
      wrap.innerHTML = casca(inner);
      stage.replaceChildren(wrap);
      stage.querySelectorAll("a[href^='#']").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const id = a.getAttribute("href").slice(1);
          if (hashToTela[id]) {
            tela.value = hashToTela[id];
            history.replaceState(null, "", "#" + tela.value);
            render();
          }
        });
      });
    }
    tela.addEventListener("change", () => { history.replaceState(null, "", "#" + tela.value); render(); });
    vp.addEventListener("change", render);
    window.addEventListener("hashchange", () => { applyHash(); render(); });
    applyHash();
    render();
  </script>
</body>
</html>
