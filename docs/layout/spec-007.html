<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EstudaAI — Layout SPEC-007 (aprovado)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              ink: "#123047",
              trail: "#1A7A72",
              trailDark: "#14635D",
              mint: "#D7F0ED",
              spark: "#E3A008",
              paper: "#F7F4EE"
            }
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    .phone-frame {
      width: min(390px, 100%);
      min-height: 640px;
      max-height: 844px;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .is-phone h2, .is-phone p, .is-phone [role="alert"], .is-phone button, .is-phone li,
    .is-phone label, .is-phone textarea, .is-phone a, .is-phone article, .is-phone code {
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
    }
    .is-phone .app-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
    }
    .is-phone .app-brand { min-width: 0; flex: 1 1 auto; }
    .is-phone .app-papel,
    .is-phone .app-nav-desktop { display: none !important; }
    .is-phone .app-nav-mobile { display: flex !important; }
    .is-phone .app-session {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      max-width: 58%;
    }
    .is-phone .app-user {
      display: inline !important;
      min-width: 0;
      max-width: 6.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .is-phone .app-sair { flex-shrink: 0; white-space: nowrap; }
  </style>
</head>
<body class="bg-brand-paper text-brand-ink">
  <header class="border-b border-amber-300 bg-amber-50 px-4 py-3 text-sm">
    <div class="mx-auto flex max-w-6xl flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <p class="font-medium text-amber-950">
        Protótipo SPEC-007 — <strong>aprovado</strong> em 2026-10-02. Casca da SPEC-001; conversa referida à trilha da SPEC-004/006. Não é o app em produção.
        <a class="ml-2 underline" href="identidade.html">Identidade</a>
        · <a class="underline" href="spec-004.html#conclusao">Progresso</a>
        · <a class="underline" href="spec-006.html#interruptor">Interruptor SPEC-006</a>
      </p>
      <div class="flex flex-wrap items-center gap-2">
        <label class="text-amber-950">Tela
          <select id="tela" class="ml-1 rounded-md border border-amber-400 bg-white px-2 py-1">
            <option value="entrada">Entrada — a partir do progresso</option>
            <option value="chat">Conversa referida à trilha</option>
            <option value="espera">Espera (até 60 s)</option>
            <option value="timeout">Falha — timeout (E2)</option>
            <option value="off">Falha — LLM desligado</option>
            <option value="recusa">Recusa — sem progresso ativo</option>
            <option value="recusa-anonimo">Recusa — anônimo</option>
            <option value="recusa-admin">Recusa — administrador</option>
          </select>
        </label>
        <label class="text-amber-950">Viewport
          <select id="vp" class="ml-1 rounded-md border border-amber-400 bg-white px-2 py-1">
            <option value="desktop">Desktop</option>
            <option value="phone">Smartphone (390px)</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl p-4 md:p-8">
    <div id="stage" class="mx-auto overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"></div>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const tela = document.getElementById("tela");
    const vp = document.getElementById("vp");

    const hashToTela = {
      entrada: "entrada",
      chat: "chat",
      espera: "espera",
      timeout: "timeout",
      falha: "timeout",
      off: "off",
      recusa: "recusa",
      "recusa-anonimo": "recusa-anonimo",
      "recusa-admin": "recusa-admin"
    };

    function applyHash() {
      const key = (location.hash || "#chat").slice(1);
      if (hashToTela[key]) tela.value = hashToTela[key];
    }

    function navAluno(ativo) {
      const item = (id, label, href) => {
        const on = ativo === id;
        return `<a href="${href}" class="${on ? "rounded-md bg-brand-mint px-3 py-1.5 text-sm font-medium text-brand-ink" : "rounded-md px-3 py-1.5 text-sm text-slate-500"}">${label}</a>`;
      };
      return `${item("inicio", "Início", "spec-001.html#inicio")}${item("catalogo", "Catálogo", "spec-004.html#catalogo")}${item("personalizada", "Trilha personalizada", "spec-006.html#pedido")}${item("progresso", "Meu progresso", "spec-004.html#progresso")}`;
    }

    function navAdmin(ativo) {
      const item = (id, label) => {
        const on = ativo === id;
        return `<span class="${on ? "rounded-md bg-brand-mint px-3 py-1.5 text-sm font-medium text-brand-ink" : "rounded-md px-3 py-1.5 text-sm text-slate-500"}">${label}</span>`;
      };
      return `${item("painel", "Painel")}${item("categorias", "Categorias")}${item("trilhas", "Trilhas")}${item("llm", "Agente LLM")}`;
    }

    function cascaAluno(ativo, inner) {
      return `<div class="min-h-[640px] bg-slate-50">
        <header class="border-b border-slate-200 bg-white">
          <div class="app-bar mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3">
            <div class="app-brand flex min-w-0 items-center gap-3">
              <img src="../identidade/marca.svg" alt="" class="h-8 w-8 shrink-0" />
              <span class="text-sm font-semibold text-brand-ink">EstudaAI</span>
              <span class="app-papel hidden rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-600 sm:inline">Aluno</span>
            </div>
            <nav class="app-nav-desktop hidden items-center gap-1 sm:flex">${navAluno(ativo)}</nav>
            <div class="app-session flex min-w-0 items-center gap-2">
              <span class="app-user hidden max-w-[9rem] truncate text-sm text-slate-600 sm:inline">Lucas Almeida</span>
              <button type="button" class="app-sair shrink-0 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-800 hover:bg-slate-50">Sair</button>
            </div>
          </div>
          <nav class="app-nav-mobile flex gap-1 overflow-x-auto border-t border-slate-100 px-4 py-2 sm:hidden">${navAluno(ativo)}</nav>
        </header>
        <section class="mx-auto max-w-5xl px-4 py-8">${inner}</section>
      </div>`;
    }

    function cascaAdmin(inner) {
      return `<div class="min-h-[640px] bg-slate-50">
        <header class="border-b border-slate-200 bg-white">
          <div class="app-bar mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3">
            <div class="app-brand flex min-w-0 items-center gap-3">
              <img src="../identidade/marca.svg" alt="" class="h-8 w-8 shrink-0" />
              <span class="text-sm font-semibold text-brand-ink">EstudaAI</span>
              <span class="app-papel hidden rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-600 sm:inline">Administrador</span>
            </div>
            <nav class="app-nav-desktop hidden items-center gap-1 sm:flex">${navAdmin("llm")}</nav>
            <div class="app-session flex min-w-0 items-center gap-2">
              <span class="app-user hidden max-w-[9rem] truncate text-sm text-slate-600 sm:inline">Mariana Costa</span>
              <button type="button" class="app-sair shrink-0 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-800 hover:bg-slate-50">Sair</button>
            </div>
          </div>
          <nav class="app-nav-mobile flex gap-1 overflow-x-auto border-t border-slate-100 px-4 py-2 sm:hidden">${navAdmin("llm")}</nav>
        </header>
        <section class="mx-auto max-w-5xl px-4 py-8">${inner}</section>
      </div>`;
    }

    function cascaAnonima(inner) {
      const nav = `
        <a href="spec-004.html#catalogo-anonimo" class="rounded-md px-3 py-1.5 text-sm text-slate-500">Catálogo</a>
        <a href="spec-006.html#recusa-anonimo" class="rounded-md px-3 py-1.5 text-sm text-slate-500">Trilha personalizada</a>`;
      return `<div class="min-h-[640px] bg-slate-50">
        <header class="border-b border-slate-200 bg-white">
          <div class="app-bar mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3">
            <div class="app-brand flex min-w-0 items-center gap-3">
              <img src="../identidade/marca.svg" alt="" class="h-8 w-8 shrink-0" />
              <span class="text-sm font-semibold text-brand-ink">EstudaAI</span>
            </div>
            <nav class="app-nav-desktop hidden items-center gap-1 sm:flex">${nav}</nav>
            <div class="app-session flex min-w-0 items-center gap-2">
              <a href="spec-001.html#login" class="app-sair shrink-0 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-800 hover:bg-slate-50">Entrar</a>
            </div>
          </div>
          <nav class="app-nav-mobile flex gap-1 overflow-x-auto border-t border-slate-100 px-4 py-2 sm:hidden">${nav}</nav>
        </header>
        <section class="mx-auto max-w-5xl px-4 py-8">${inner}</section>
      </div>`;
    }

    function alerta(texto, tom = "red") {
      const cls = tom === "red"
        ? "border-red-200 bg-red-50 text-red-800"
        : tom === "amber"
          ? "border-amber-200 bg-amber-50 text-amber-950"
          : "border-emerald-200 bg-emerald-50 text-emerald-800";
      return `<div class="rounded-md border px-3 py-2 text-sm leading-relaxed ${cls}" role="alert">${texto}</div>`;
    }

    function bolha({ origem, texto, hora }) {
      const aluno = origem === "aluno";
      return `<article class="flex ${aluno ? "justify-end" : "justify-start"}">
        <div class="max-w-[85%] rounded-lg border px-3 py-2 ${aluno ? "border-brand-trail bg-brand-mint text-brand-ink" : "border-slate-200 bg-white text-slate-800"}">
          <p class="text-[0.65rem] font-medium uppercase tracking-wide ${aluno ? "text-brand-trail" : "text-slate-500"}">${aluno ? "aluno" : "agente LLM"} · ${hora}</p>
          <p class="mt-1 text-sm leading-relaxed">${texto}</p>
        </div>
      </article>`;
    }

    function composer({ disabled, botao, valor }) {
      return `<form class="mt-4 space-y-3">
        <label class="block text-sm font-medium leading-snug text-slate-700">Mensagem
          <textarea name="texto" rows="3" ${disabled ? "disabled" : ""}
            class="mt-1 w-full min-w-0 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none ring-brand-trail focus:border-brand-trail focus:ring-2 disabled:bg-slate-50">${valor || ""}</textarea>
        </label>
        <p class="rounded-md bg-slate-50 px-3 py-2 text-xs text-slate-600">A chamada sai só da API Nest (Gemini), referida a esta trilha. Nenhuma chave aparece neste navegador (ADR-002 / INV-007-06). Timeout 60 s — fora do SLA de 2 s (RNF03). Sem fila.</p>
        <div class="flex flex-col gap-2 sm:flex-row">
          <a href="${botao.href}" class="inline-flex w-full items-center justify-center rounded-md bg-brand-trail px-3 py-2 text-sm font-medium text-white hover:bg-brand-trailDark sm:w-auto ${disabled ? "pointer-events-none opacity-60" : ""}">${botao.label}</a>
          <a href="spec-004.html#conclusao" class="inline-flex w-full items-center justify-center rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 sm:w-auto">Voltar à trilha</a>
        </div>
      </form>`;
    }

    function cabecalhoTrilha() {
      return `
        <p class="text-sm text-slate-500"><a class="text-brand-trail underline" href="spec-004.html#conclusao">← SQL para totais mensais</a></p>
        <h2 class="mt-2 text-2xl font-semibold leading-snug">Conversa</h2>
        <p class="mt-1 text-sm text-slate-500">Personalizada · trilha personalizada · <strong>Progresso ativo</strong></p>
        <p class="mt-2 max-w-xl text-sm leading-relaxed text-slate-600">Toda mensagem refere-se a esta trilha (INV-007-01 / OPEN-14). O agente não cria nem altera trilhas pré-definidas (RB10 / AC-007-03).</p>`;
    }

    function entradaInner() {
      return `
        <p class="text-sm text-slate-500"><a class="text-brand-trail underline" href="spec-004.html#catalogo">← Catálogo</a></p>
        <h2 class="mt-2 text-2xl font-semibold leading-snug">SQL para totais mensais</h2>
        <p class="mt-1 text-sm text-slate-500">Personalizada · trilha personalizada</p>
        <p class="mt-2 max-w-xl text-sm leading-relaxed text-slate-600">Acompanhe as etapas. A conversa com o agente é um «extend» (UC01-A5): só existe com progresso ativo nesta trilha.</p>
        <div class="mt-6 rounded-lg border border-slate-200 bg-white p-4">
          <p class="text-sm font-medium text-brand-ink">Progresso: 0 de 3 etapas <span class="font-normal text-slate-500">(0%)</span></p>
          <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-200"><div class="h-full w-0 rounded-full bg-brand-trail"></div></div>
        </div>
        <div class="mt-4 flex flex-col gap-2 sm:flex-row">
          <a href="#chat" class="inline-flex items-center justify-center rounded-md bg-brand-trail px-3 py-2 text-sm font-medium text-white hover:bg-brand-trailDark">Conversar sobre esta trilha</a>
        </div>
        <p class="mt-6 text-xs text-slate-500">Não há conversa global nem chat anônimo. O administrador não usa este fluxo (RB14 / AC-007-06).</p>`;
    }

    function chatInner(extra, opts) {
      const msgs = opts.mensagens || [
        bolha({ origem: "aluno", hora: "10:12", texto: "No GROUP BY, o total por mês entra no SELECT ou só no agrupamento?" }),
        bolha({ origem: "agente LLM", hora: "10:12", texto: "Nesta trilha, a etapa 2 pede o total no SELECT com uma função de agregação (por exemplo <code class='rounded bg-slate-100 px-1 font-mono text-[0.85em]'>SUM</code>) e o mês no <code class='rounded bg-slate-100 px-1 font-mono text-[0.85em]'>GROUP BY</code>. Isso não altera o catálogo curado." })
      ];
      return `
        ${cabecalhoTrilha()}
        ${extra || ""}
        <div class="mt-6 space-y-3">${msgs.join("")}</div>
        ${composer(opts.composer)}
        <p class="mt-6 text-xs text-slate-500">Turnos persistidos com origem ∈ {aluno, agente LLM}. Gerar nova trilha é a SPEC-006, não esta tela.</p>`;
    }

    function recusaProgressoInner() {
      return `
        <h2 class="text-2xl font-semibold">Conversa</h2>
        <div class="mt-4">${alerta("Sem progresso ativo em uma trilha, a conversa é recusada. Nenhuma mensagem foi gravada e o catálogo não mudou (OPEN-14 / INV-007-02 / AC-007-02).")}</div>
        <p class="mt-4 max-w-xl text-sm leading-relaxed text-slate-600">Comece ou retome um acompanhamento. A conversa só existe referida a essa trilha.</p>
        <p class="mt-3 text-sm"><a class="text-brand-trail underline" href="spec-004.html#catalogo">Ir ao catálogo</a></p>
        <p class="mt-2 text-sm"><a class="text-slate-600 underline" href="spec-004.html#progresso">Meu progresso</a></p>`;
    }

    function recusaAnonimoInner() {
      return `
        <h2 class="text-2xl font-semibold">Conversa</h2>
        <div class="mt-4">${alerta("Para conversar com o agente, entre como aluno e tenha uma trilha em andamento. A listagem do catálogo continua visível (E1 / RB01 / AC-007-06).")}</div>
        <p class="mt-3 text-sm"><a class="text-brand-trail underline" href="spec-001.html#login">Ir para o login</a></p>
        <p class="mt-4 text-sm"><a class="text-slate-600 underline" href="spec-004.html#catalogo-anonimo">Ver catálogo sem conta</a></p>`;
    }

    function recusaAdminInner() {
      return `
        <h2 class="text-2xl font-semibold">Conversa</h2>
        <p class="mt-1 max-w-xl text-sm leading-relaxed text-slate-600">O UC01 é exclusivo do aluno. O administrador liga ou desliga o Gemini; não conversa sobre trilha de estudo (RB14 / AC-007-06).</p>
        <div class="mt-4">${alerta("Operação recusada para este perfil. Nenhuma mensagem foi gravada.")}</div>
        <p class="mt-4 text-sm"><a class="text-brand-trail underline" href="spec-006.html#interruptor">Ir ao interruptor do agente</a></p>`;
    }

    function render() {
      stage.className = vp.value === "phone"
        ? "is-phone phone-frame mx-auto rounded-[1.5rem] border-8 border-slate-900 bg-white shadow-lg"
        : "overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm";

      const v = tela.value;
      let html = "";
      if (v === "entrada") html = cascaAluno("progresso", entradaInner());
      if (v === "chat") html = cascaAluno("progresso", chatInner("", {
        composer: { disabled: false, botao: { href: "#espera", label: "Enviar" }, valor: "" }
      }));
      if (v === "espera") html = cascaAluno("progresso", chatInner(
        `<div class="mt-4">${alerta("Aguardando o agente… Pode levar até 60 segundos. O catálogo e as etapas não foram alterados. O progresso já existente continua disponível (RNF03 / OPEN-20).", "amber")}</div>`,
        {
          mensagens: [
            bolha({ origem: "aluno", hora: "10:12", texto: "No GROUP BY, o total por mês entra no SELECT ou só no agrupamento?" }),
            bolha({ origem: "agente LLM", hora: "10:12", texto: "Nesta trilha, a etapa 2 pede o total no SELECT com uma função de agregação (por exemplo <code class='rounded bg-slate-100 px-1 font-mono text-[0.85em]'>SUM</code>) e o mês no <code class='rounded bg-slate-100 px-1 font-mono text-[0.85em]'>GROUP BY</code>. Isso não altera o catálogo curado." }),
            bolha({ origem: "aluno", hora: "10:14", texto: "E a etapa 3 usa JOIN com a tabela de produtos?" })
          ],
          composer: { disabled: true, botao: { href: "#espera", label: "Enviando…" }, valor: "E a etapa 3 usa JOIN com a tabela de produtos?" }
        }
      ));
      if (v === "timeout") html = cascaAluno("progresso", chatInner(
        `<div class="mt-4">${alerta("O agente não respondeu em 60 segundos. O catálogo e as etapas desta trilha não foram alterados (E2 / OPEN-20 / AC-007-04). Você pode tentar de novo ou voltar ao acompanhamento.")}</div>`,
        {
          mensagens: [bolha({ origem: "aluno", hora: "10:14", texto: "E a etapa 3 usa JOIN com a tabela de produtos?" })],
          composer: { disabled: false, botao: { href: "#espera", label: "Tentar de novo" }, valor: "E a etapa 3 usa JOIN com a tabela de produtos?" }
        }
      ));
      if (v === "off") html = cascaAluno("progresso", chatInner(
        `<div class="mt-4">${alerta("O agente está desligado pela administradora. Nenhuma mensagem nova foi gravada e o catálogo permanece intacto (AC-007-05). Use o acompanhamento da trilha.")}</div>`,
        {
          mensagens: [],
          composer: { disabled: true, botao: { href: "#off", label: "Enviar" }, valor: "" }
        }
      ));
      if (v === "recusa") html = cascaAluno("progresso", recusaProgressoInner());
      if (v === "recusa-anonimo") html = cascaAnonima(recusaAnonimoInner());
      if (v === "recusa-admin") html = cascaAdmin(recusaAdminInner());

      const wrap = document.createElement("div");
      wrap.innerHTML = html;
      stage.replaceChildren(wrap);
      stage.querySelectorAll("a[href^='#']").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const id = a.getAttribute("href").slice(1);
          if (hashToTela[id]) {
            tela.value = hashToTela[id];
            history.replaceState(null, "", "#" + tela.value);
            render();
          }
        });
      });
    }

    tela.addEventListener("change", () => {
      history.replaceState(null, "", "#" + tela.value);
      render();
    });
    vp.addEventListener("change", render);
    window.addEventListener("hashchange", () => { applyHash(); render(); });
    applyHash();
    render();
  </script>
</body>
</html>
