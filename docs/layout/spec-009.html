<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EstudaAI — Layout SPEC-009 (aprovado)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              ink: "#123047",
              trail: "#1A7A72",
              trailDark: "#14635D",
              mint: "#D7F0ED",
              spark: "#E3A008",
              paper: "#F7F4EE"
            }
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    .phone-frame {
      width: min(390px, 100%);
      min-height: 640px;
      max-height: 844px;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .is-phone h2, .is-phone p, .is-phone [role="alert"], .is-phone button, .is-phone td, .is-phone th {
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
    }
    .is-phone .app-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
    }
    .is-phone .app-brand { min-width: 0; flex: 1 1 auto; }
    .is-phone .app-papel,
    .is-phone .app-nav-desktop { display: none !important; }
    .is-phone .app-nav-mobile { display: flex !important; }
    .is-phone .app-session {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      max-width: 58%;
    }
    .is-phone .app-user {
      display: inline !important;
      min-width: 0;
      max-width: 6.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .is-phone .app-sair { flex-shrink: 0; white-space: nowrap; }
    .is-phone table { display: block; }
    .is-phone thead { display: none; }
    .is-phone tbody, .is-phone tr, .is-phone td { display: block; width: 100%; }
    .is-phone tr {
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      margin-bottom: 0.75rem;
      padding: 0.75rem;
      background: #fff;
    }
    .is-phone td { padding: 0.15rem 0; }
  </style>
</head>
<body class="bg-brand-paper text-brand-ink">
  <header class="border-b border-amber-300 bg-amber-50 px-4 py-3 text-sm">
    <div class="mx-auto flex max-w-6xl flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <p class="font-medium text-amber-950">
        Protótipo SPEC-009 — layout <strong>aprovado</strong> em 2026-10-08. Consulta somente leitura. Não é o app em produção.
        <a class="ml-2 underline" href="identidade.html">Identidade</a>
      </p>
      <div class="flex flex-wrap items-center gap-2">
        <label class="text-amber-950">Tela
          <select id="tela" class="ml-1 rounded-md border border-amber-400 bg-white px-2 py-1">
            <option value="lista">Lista de andamento</option>
            <option value="aluno">Detalhe do aluno</option>
            <option value="trilha">Detalhe de uma trilha</option>
            <option value="vazio">Aluno sem progresso</option>
          </select>
        </label>
        <label class="text-amber-950">Viewport
          <select id="vp" class="ml-1 rounded-md border border-amber-400 bg-white px-2 py-1">
            <option value="desktop">Desktop</option>
            <option value="phone">Smartphone (390px)</option>
          </select>
        </label>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-6xl p-4 md:p-8">
    <div id="stage" class="mx-auto overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"></div>
  </main>
  <script>
    const stage = document.getElementById("stage");
    const tela = document.getElementById("tela");
    const vp = document.getElementById("vp");
    const hashToTela = { lista: "lista", aluno: "aluno", trilha: "trilha", vazio: "vazio" };
    function applyHash() {
      const key = (location.hash || "#lista").slice(1);
      if (hashToTela[key]) tela.value = hashToTela[key];
    }
    function navAdmin(ativo) {
      const on = (id) => id === ativo
        ? "rounded-md bg-brand-mint px-3 py-1.5 text-sm font-medium text-brand-ink"
        : "rounded-md px-3 py-1.5 text-sm text-slate-400";
      return `
        <span class="${on("painel")}">Painel</span>
        <span class="${on("categorias")}">Categorias</span>
        <span class="${on("trilhas")}">Trilhas</span>
        <span class="${on("usuarios")}">Usuários</span>
        <span class="${on("andamento")}">Andamento</span>
        <span class="${on("agente")}">Agente LLM</span>`;
    }
    function casca(inner) {
      return `<div class="min-h-[640px] bg-slate-50">
        <header class="border-b border-slate-200 bg-white">
          <div class="app-bar mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3">
            <div class="app-brand flex min-w-0 items-center gap-3">
              <img src="../identidade/marca.svg" alt="" class="h-8 w-8 shrink-0" />
              <span class="text-sm font-semibold text-brand-ink">EstudaAI</span>
              <span class="app-papel hidden rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-600 sm:inline">Administrador</span>
            </div>
            <nav class="app-nav-desktop hidden items-center gap-1 sm:flex">${navAdmin("andamento")}</nav>
            <div class="app-session flex min-w-0 items-center gap-2">
              <span class="app-user hidden max-w-[9rem] truncate text-sm text-slate-600 sm:inline">Mariana Costa</span>
              <button type="button" class="app-sair shrink-0 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-800 hover:bg-slate-50">Sair</button>
            </div>
          </div>
          <nav class="app-nav-mobile flex gap-1 overflow-x-auto border-t border-slate-100 px-4 py-2 sm:hidden">${navAdmin("andamento")}</nav>
        </header>
        <section class="mx-auto max-w-5xl px-4 py-8">${inner}</section>
      </div>`;
    }
    function barra(pct) {
      const n = Math.round(pct * 100);
      return `<div class="mt-1 h-2 w-full overflow-hidden rounded-full bg-slate-100">
        <div class="h-2 rounded-full bg-brand-trail" style="width:${n}%"></div>
      </div><p class="mt-1 text-xs text-slate-500">${n}%</p>`;
    }
    const lista = `
      <h2 class="text-2xl font-semibold">Andamento dos alunos</h2>
      <p class="mt-1 max-w-xl text-sm leading-relaxed text-slate-600">Quem está estudando o quê, e quanto já concluiu. Esta tela não marca etapas nem abre conversa.</p>
      <div class="mt-6 overflow-hidden rounded-lg border border-slate-200 bg-white">
        <table class="w-full min-w-0 text-left text-sm">
          <thead class="border-b border-slate-200 bg-slate-50 text-slate-600">
            <tr>
              <th class="px-4 py-2 font-medium">Aluno</th>
              <th class="px-4 py-2 font-medium">Trilhas</th>
              <th class="px-4 py-2 font-medium">Ação</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            <tr>
              <td class="px-4 py-3 font-medium text-brand-ink">Lucas Almeida<br /><span class="font-normal text-slate-500">lucas@exemplo.com</span></td>
              <td class="px-4 py-3 text-slate-600">Lógica de programação · 67%<br />SQL para totais mensais · 0%</td>
              <td class="px-4 py-3"><a class="text-brand-trail underline" href="#aluno">Ver detalhes</a></td>
            </tr>
            <tr>
              <td class="px-4 py-3 font-medium text-brand-ink">Ana Souza<br /><span class="font-normal text-slate-500">ana@exemplo.com</span></td>
              <td class="px-4 py-3 text-slate-600">Nenhuma trilha em andamento</td>
              <td class="px-4 py-3"><a class="text-brand-trail underline" href="#vazio">Ver detalhes</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    `;
    const aluno = `
      <p class="text-sm text-slate-500"><a class="text-brand-trail underline" href="#lista">← Andamento</a></p>
      <h2 class="mt-2 text-2xl font-semibold">Lucas Almeida</h2>
      <p class="mt-1 text-sm text-slate-600">lucas@exemplo.com · aluno</p>
      <div class="mt-6 grid gap-4">
        <a href="#trilha" class="block rounded-lg border border-slate-200 bg-white p-4 hover:border-brand-trail">
          <p class="text-sm font-medium text-brand-ink">Lógica de programação</p>
          <p class="mt-1 text-xs text-slate-500">Pré-definida · Programação · 2 de 3 etapas</p>
          ${barra(2/3)}
        </a>
        <a href="#trilha" class="block rounded-lg border border-slate-200 bg-white p-4 hover:border-brand-trail">
          <p class="text-sm font-medium text-brand-ink">SQL para totais mensais</p>
          <p class="mt-1 text-xs text-slate-500">Personalizada · 0 de 4 etapas</p>
          ${barra(0)}
        </a>
      </div>
      <p class="mt-6 text-xs text-slate-500">O percentual é calculado pelas etapas que o aluno marcou. Você não conclui etapas por ele.</p>
    `;
    const trilha = `
      <p class="text-sm text-slate-500"><a class="text-brand-trail underline" href="#aluno">← Lucas Almeida</a></p>
      <h2 class="mt-2 text-2xl font-semibold">Lógica de programação</h2>
      <p class="mt-1 text-sm text-slate-600">Pré-definida · Programação</p>
      <div class="mt-4 max-w-lg">${barra(2/3)}</div>
      <ol class="mt-6 max-w-lg space-y-3">
        <li class="rounded-lg border border-slate-200 bg-white p-3">
          <p class="text-sm font-medium text-brand-ink">1. Variáveis</p>
          <p class="text-xs text-brand-trail">Concluída</p>
        </li>
        <li class="rounded-lg border border-slate-200 bg-white p-3">
          <p class="text-sm font-medium text-brand-ink">2. Condicionais</p>
          <p class="text-xs text-brand-trail">Concluída</p>
        </li>
        <li class="rounded-lg border border-slate-200 bg-white p-3">
          <p class="text-sm font-medium text-brand-ink">3. Laços</p>
          <p class="text-xs text-slate-500">Pendente · próxima etapa</p>
        </li>
      </ol>
    `;
    const vazio = `
      <p class="text-sm text-slate-500"><a class="text-brand-trail underline" href="#lista">← Andamento</a></p>
      <h2 class="mt-2 text-2xl font-semibold">Ana Souza</h2>
      <p class="mt-1 text-sm text-slate-600">ana@exemplo.com · aluno</p>
      <p class="mt-6 rounded-lg border border-slate-200 bg-white p-4 text-sm text-slate-600">Este aluno ainda não acompanha nenhuma trilha. Nada foi iniciado por aqui.</p>
    `;
    function render() {
      stage.className = vp.value === "phone"
        ? "is-phone phone-frame mx-auto rounded-[1.5rem] border-8 border-slate-900 bg-white shadow-lg"
        : "overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm";
      const v = tela.value;
      let inner = lista;
      if (v === "aluno") inner = aluno;
      if (v === "trilha") inner = trilha;
      if (v === "vazio") inner = vazio;
      const wrap = document.createElement("div");
      wrap.innerHTML = casca(inner);
      stage.replaceChildren(wrap);
      stage.querySelectorAll("a[href^='#']").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const id = a.getAttribute("href").slice(1);
          if (hashToTela[id]) {
            tela.value = hashToTela[id];
            history.replaceState(null, "", "#" + tela.value);
            render();
          }
        });
      });
    }
    tela.addEventListener("change", () => { history.replaceState(null, "", "#" + tela.value); render(); });
    vp.addEventListener("change", render);
    window.addEventListener("hashchange", () => { applyHash(); render(); });
    applyHash();
    render();
  </script>
</body>
</html>
